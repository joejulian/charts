apiVersion: v1
kind: Service
metadata:
  name: {{ include "zigbee-bridge.fullname" . }}
  labels:
    {{- include "zigbee-bridge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "zigbee-bridge.selectorLabels" . | nindent 4 }}
    zigbee-bridge/mode: serving
