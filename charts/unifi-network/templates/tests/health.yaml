apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-health
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      {{- $image := .Values.controllers.main.containers.main.image }}
      image: {{ $image.repository }}{{ if $image.digest }}@{{ $image.digest }}{{ else }}:{{ $image.tag | default .Chart.AppVersion }}{{ end }}
      command: [sh, -ec]
      args:
        - 'curl -fkSs --max-time 10 https://{{ .Release.Name }}:8443/status | grep -q ''"rc":"ok"'''
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
