{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-operator
  labels:
    {{- include "kadalu-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers", "storageclasses"]
    verbs: ["create", "delete", "get", "list", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-operator
  labels:
    {{- include "kadalu-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kadalu-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kadalu-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumes", "pods", "pods/exec", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["kadalu-operator.storage"]
    resources: ["kadalustorages"]
    verbs: ["watch", "get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kadalu-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kadalu-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: kadalu-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kadalu-operator
{{- end }}
