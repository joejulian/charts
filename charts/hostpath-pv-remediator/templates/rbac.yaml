apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hostpath-pv-remediator.fullname" . }}
  labels:
    {{- include "hostpath-pv-remediator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hostpath-pv-remediator.fullname" . }}
  labels:
    {{- include "hostpath-pv-remediator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hostpath-pv-remediator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hostpath-pv-remediator.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hostpath-pv-remediator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hostpath-pv-remediator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames:
      - {{ include "hostpath-pv-remediator.leaderElectionLeaseName" . }}
      - {{ include "hostpath-pv-remediator.repairLeaseName" . }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hostpath-pv-remediator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hostpath-pv-remediator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hostpath-pv-remediator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hostpath-pv-remediator.fullname" . }}
