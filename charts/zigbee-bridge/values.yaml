# One owner per coordinator. Zero stops this service for maintenance or rollback.
replicaCount: 1
image:
  # Set an explicitly published repository and immutable tag or digest.
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
fullnameOverride: ""

# A ConfigMap containing config.toml. Paths below match the container defaults.
configMapName: ""
# Secrets are supplied as environment variables (for example ZIGBEE_FRONTEND_TOKEN).
existingSecret: ""

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  existingClaim: ""
  size: 1Gi
  accessModes: [ReadWriteOnce]
  storageClass: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# For serial adapters, mount only the selected host device and grant the
# matching supplemental group/device permissions through these supported values.
extraVolumes: []
extraVolumeMounts: []
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# These probes establish frontend listener health, not radio/device availability.
probes:
  enabled: true
