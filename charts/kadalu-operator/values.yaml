operator:
  enabled: true
  image:
    repository: ghcr.io/joejulian/kadalu-operator
    tag: "1.4.0-rc.5"
    digest: ""
    pullPolicy: IfNotPresent
  progressDeadlineSeconds: 86400
  resources: {}
  verbose: "no"

runtimeDefaults:
  version: "1.4.0-rc.5"
  imageRegistry: ghcr.io
  imageRepository: joejulian
  csiSidecarRegistry: registry.k8s.io
  # renovate: image=docker.io/library/busybox
  loggingImage: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
  kubeletDir: /var/lib/kubelet
  kubernetesDistro: kubernetes

componentConfigMaps:
  csi: kadalu-csi-config
  server: kadalu-server-config

migration:
  # One upgrade may retain the old monolithic chart's component RBAC before
  # the CSI and storage releases adopt it. Disable after both adoptions.
  retainComponentRBAC: false
