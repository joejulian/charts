apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "onstar2mqtt.fullname" . }}-test-connection"
  labels:
    {{- include "onstar2mqtt.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      # renovate: image=docker.io/library/busybox
      image: docker.io/library/busybox:1.38.0
      command: ['wget']
      args: ['{{ include "onstar2mqtt.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
