tests:
  enabled: true

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      # Conservative x86 placement for MongoDB's Haswell-or-newer Intel floor.
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: ghcr.io/joejulian/container-images/unifi-network
          tag:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                scheme: HTTPS
                path: /status
                port: 8443
              failureThreshold: 120
              periodSeconds: 10
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -ec
                  - 'curl -fkSs --max-time 5 https://127.0.0.1:8443/status | grep -q ''"up":true'''
              periodSeconds: 10
              timeoutSeconds: 10
        resources:
          requests:
            memory: 1Gi
      mongodb:
        image:
          repository: ghcr.io/joejulian/container-images/mongodb
          # renovate: image=ghcr.io/joejulian/container-images/mongodb
          tag: "8.0.34"
        command: [mongod]
        args: [--bind_ip, "127.0.0.1", --port, "27117", --dbpath, /data/db]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command: [mongosh, --quiet, --port, "27117", --eval, "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
              periodSeconds: 10
              timeoutSeconds: 10
        resources:
          requests:
            memory: 256Mi
service:
  main:
    controller: main
    forceRename: '{{ .Release.Name }}'
    ports:
      http:
        port: 8443
        appProtocol: https
      controller:
        port: 8080
      speedtest:
        port: 6789
  udp:
    enabled: true
    controller: main
    ports:
      stun:
        port: 3478
        protocol: UDP
      syslog:
        port: 5514
        protocol: UDP
      discovery:
        port: 10001
        protocol: UDP
persistence:
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 16Gi
    retain: true
    advancedMounts:
      main:
        main:
          - path: /unifi
            subPath: controller
        mongodb:
          - path: /data/db
            subPath: mongodb
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
