apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hostpath-pv-remediator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hostpath-pv-remediator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hostpath-pv-remediator.repairServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hostpath-pv-remediator.labels" . | nindent 4 }}
    app.kubernetes.io/component: repair
  {{- with .Values.repairServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
