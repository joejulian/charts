image:
  repository: ghcr.io/joejulian/container-images/python
  tag: 3.13.15-bookworm
workingDir: /tmp
command: [python3, -c]
args:
  - |
    import http.server
    from pathlib import Path
    p = Path("sdcpp/v1/capabilities")
    p.parent.mkdir(parents=True)
    p.write_text('{"fixture": true}')
    http.server.ThreadingHTTPServer(
        ("0.0.0.0", 8080), http.server.SimpleHTTPRequestHandler
    ).serve_forever()
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 128Mi
