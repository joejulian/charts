existingSecret: dummy-todo-config
persistence:
  enabled: false
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: dummy-todo-config
    stringData:
      HA_URL: http://dummy-ha:8123
      HA_TOKEN: dummy-token
      HA_TODO_ENTITY: todo.personal
      HA_AUTH_URL: https://ha.example.invalid
      HA_ALLOWED_USER_ID: dummy-owner
      PUBLIC_URL: https://ha.example.invalid/todo-bridge
      OAUTH_SIGNING_KEY: dummy-signing-key-for-isolated-ci-only-123456789
      OAUTH_STORAGE_KEY: dummy-storage-key-for-isolated-ci-only-123456789
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: dummy-ha
    data:
      server.py: |
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_POST(self):
                body = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
                assert self.headers['Authorization'] == 'Bearer dummy-token'
                assert body['entity_id'] == 'todo.personal'
                assert self.path == '/api/services/todo/get_items?return_response'
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"service_response":{"todo.personal":{"items":[]}}}')
            def log_message(self, *args):
                pass
        HTTPServer(('0.0.0.0', 8123), Handler).serve_forever()
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dummy-ha
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: dummy-ha
      template:
        metadata:
          labels:
            app: dummy-ha
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mock
              image: ghcr.io/joejulian/ha-todo-mcp:v0.1.0
              command: [python, /mock/server.py]
              ports:
                - containerPort: 8123
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: mock
                  mountPath: /mock
          volumes:
            - name: mock
              configMap:
                name: dummy-ha
  - apiVersion: v1
    kind: Service
    metadata:
      name: dummy-ha
    spec:
      selector:
        app: dummy-ha
      ports:
        - port: 8123
          targetPort: 8123
